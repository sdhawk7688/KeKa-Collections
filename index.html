<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Contact KeKa Collections – Reach out for orders, queries or feedback.">
  <title>Contact | KeKa Collections</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">KeKa <span>Collections</span></a>
      <button class="menu-toggle" aria-label="Toggle menu">☰</button>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Home</a></li>
          <li><a href="sarees.html">Sarees</a></li>
          <li><a href="categories.html">Categories</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="section">
    <h1 class="section-title">Contact Us</h1>
    <p class="section-subtitle">We’d love to hear from you. Send us a message and we’ll respond soon.</p>

    <form id="contact-form" class="contact-form">
      <div class="form-group">
        <label for="name">Your Name</label>
        <input type="text" id="name" name="name" required placeholder="Enter your name">
      </div>
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="Enter your email">
      </div>
      <div class="form-group">
        <label for="message">Message</label>
        <textarea id="message" name="message" required placeholder="How can we help you?"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
    </form>

    <div class="contact-info">
      <p><strong>Email:</strong> hello@kekacollections.com</p>
      <p><strong>Phone:</strong> +91 98765 43210</p>
      <p><strong>Hours:</strong> Mon – Sat, 10 AM – 7 PM IST</p>
    </div>
  </section>

  <footer class="footer">
    <p>&copy; 2026 KeKa Collections. All rights reserved.</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
